{% extends "domain/operator/base.html" %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">Configuration</p><h1>{{ title }}</h1></div></div>
  <div class="management-grid"><section><h2>Add {{ title|slice:":-1" }}</h2><form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<button type="submit">Save</button></form></section><section><h2>Existing records</h2><ul class="record-list">{% for item in items %}<li><span>{{ item }}</span><a href="{% url 'update-resource' resource item.pk %}">Edit</a></li>{% empty %}<li>No records yet.</li>{% endfor %}</ul></section></div>
{% endblock %}
