[tool.poetry]
name = "janus"
version = "0.1.0"
description = "Internal ANPR/OCR recognition service for Cerberus"
authors = ["Cerberus Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"
mypy = "^1.16.0"
pytest = "^8.4.0"
pre-commit = "^4.2.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["janus_service"]
