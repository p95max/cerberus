services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerberus}
      POSTGRES_USER: ${POSTGRES_USER:-cerberus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    develop:
      watch:
        - action: rebuild
          path: ./backend
    environment:
      CERBERUS_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: change-me-for-local-development
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerberus}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-cerberus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CREATE_TEST_OPERATOR: ${CREATE_TEST_OPERATOR:-true}
      TEST_OPERATOR_USERNAME: ${TEST_OPERATOR_USERNAME:-operator}
      TEST_OPERATOR_PASSWORD: ${TEST_OPERATOR_PASSWORD:-operator-demo-password}
      CREATE_TEST_MANAGER: ${CREATE_TEST_MANAGER:-true}
      TEST_MANAGER_USERNAME: ${TEST_MANAGER_USERNAME:-manager}
      TEST_MANAGER_PASSWORD: ${TEST_MANAGER_PASSWORD:-manager-demo-password}
      CREATE_TEST_ADMIN: ${CREATE_TEST_ADMIN:-true}
      TEST_ADMIN_USERNAME: ${TEST_ADMIN_USERNAME:-admin}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-admin-demo-password}
      CREATE_DEMO_DATA: ${CREATE_DEMO_DATA:-true}
      DEMO_EVENT_SUBMISSION_ENABLED: ${DEMO_EVENT_SUBMISSION_ENABLED:-true}
      MOCK_BARRIER_CONTROL_ENABLED: ${MOCK_BARRIER_CONTROL_ENABLED:-true}
      DEMO_SERVICE_USERNAME: ${DEMO_SERVICE_USERNAME:-janus-demo}
      DEMO_SERVICE_CLIENT_ID: ${DEMO_SERVICE_CLIENT_ID:-janus-demo}
      DEMO_SERVICE_KEY: ${DEMO_SERVICE_KEY:-janus-demo-key}
      RECOGNITION_RETENTION_ENABLED: ${RECOGNITION_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED: ${RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_DAYS: ${RECOGNITION_IMAGE_METADATA_RETENTION_DAYS:-30}
      RECOGNITION_EVENT_RETENTION_ENABLED: ${RECOGNITION_EVENT_RETENTION_ENABLED:-true}
      RECOGNITION_EVENT_RETENTION_DAYS: ${RECOGNITION_EVENT_RETENTION_DAYS:-180}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED:-true}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS:-730}
      RECOGNITION_PURGE_INTERVAL_SECONDS: ${RECOGNITION_PURGE_INTERVAL_SECONDS:-3600}
      BARRIER_AUTO_CLOSE_SECONDS: ${BARRIER_AUTO_CLOSE_SECONDS:-10}
      BARRIER_CLOSE_RECONCILIATION_SECONDS: ${BARRIER_CLOSE_RECONCILIATION_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - application

  celery_worker:
    build:
      context: ./backend
    develop:
      watch:
        - action: rebuild
          path: ./backend
    command: celery -A config worker --loglevel=INFO
    environment:
      CERBERUS_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: change-me-for-local-development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerberus}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-cerberus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RECOGNITION_RETENTION_ENABLED: ${RECOGNITION_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED: ${RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_DAYS: ${RECOGNITION_IMAGE_METADATA_RETENTION_DAYS:-30}
      RECOGNITION_EVENT_RETENTION_ENABLED: ${RECOGNITION_EVENT_RETENTION_ENABLED:-true}
      RECOGNITION_EVENT_RETENTION_DAYS: ${RECOGNITION_EVENT_RETENTION_DAYS:-180}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED:-true}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS:-730}
      RECOGNITION_PURGE_INTERVAL_SECONDS: ${RECOGNITION_PURGE_INTERVAL_SECONDS:-3600}
      BARRIER_AUTO_CLOSE_SECONDS: ${BARRIER_AUTO_CLOSE_SECONDS:-10}
      BARRIER_CLOSE_RECONCILIATION_SECONDS: ${BARRIER_CLOSE_RECONCILIATION_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application

  celery_beat:
    build:
      context: ./backend
    develop:
      watch:
        - action: rebuild
          path: ./backend
    command: celery -A config beat --loglevel=INFO
    environment:
      CERBERUS_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: change-me-for-local-development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerberus}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-cerberus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RECOGNITION_RETENTION_ENABLED: ${RECOGNITION_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED: ${RECOGNITION_IMAGE_METADATA_RETENTION_ENABLED:-true}
      RECOGNITION_IMAGE_METADATA_RETENTION_DAYS: ${RECOGNITION_IMAGE_METADATA_RETENTION_DAYS:-30}
      RECOGNITION_EVENT_RETENTION_ENABLED: ${RECOGNITION_EVENT_RETENTION_ENABLED:-true}
      RECOGNITION_EVENT_RETENTION_DAYS: ${RECOGNITION_EVENT_RETENTION_DAYS:-180}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_ENABLED:-true}
      RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS: ${RECOGNITION_AGGREGATE_AUDIT_RETENTION_DAYS:-730}
      RECOGNITION_PURGE_INTERVAL_SECONDS: ${RECOGNITION_PURGE_INTERVAL_SECONDS:-3600}
      BARRIER_CLOSE_RECONCILIATION_SECONDS: ${BARRIER_CLOSE_RECONCILIATION_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application

  janus:
    build:
      context: ./janus
      target: development
    develop:
      watch:
        - action: rebuild
          path: ./janus
    environment:
      JANUS_ENV: development
      JANUS_PORT: ${JANUS_PORT:-8001}
      JANUS_API_KEY: ${JANUS_API_KEY:-janus-local-development-key}
      JANUS_MAX_FILE_SIZE_BYTES: ${JANUS_MAX_FILE_SIZE_BYTES:-10485760}
      JANUS_PROCESSING_TIMEOUT_SECONDS: ${JANUS_PROCESSING_TIMEOUT_SECONDS:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import urlopen; urlopen(f\"http://127.0.0.1:{os.getenv('JANUS_PORT', '8001')}/healthz\", timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - application

  nginx:
    build:
      context: ./nginx
    develop:
      watch:
        - action: rebuild
          path: ./nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      janus:
        condition: service_healthy
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      - ./static/favicon.png:/usr/share/nginx/html/favicon.png:ro
    networks:
      - edge
      - application

volumes:
  postgres_data:
  static_data:

networks:
  edge:
  application:
    internal: true
