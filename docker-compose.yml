services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerberus}
      POSTGRES_USER: ${POSTGRES_USER:-cerberus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  backend:
    build:
      context: ./backend
    develop:
      watch:
        - action: rebuild
          path: ./backend
    environment:
      CERBERUS_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: change-me-for-local-development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerberus}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-cerberus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CREATE_TEST_OPERATOR: ${CREATE_TEST_OPERATOR:-true}
      TEST_OPERATOR_USERNAME: ${TEST_OPERATOR_USERNAME:-operator}
      TEST_OPERATOR_PASSWORD: ${TEST_OPERATOR_PASSWORD:-operator-demo-password}
      CREATE_TEST_ADMIN: ${CREATE_TEST_ADMIN:-true}
      TEST_ADMIN_USERNAME: ${TEST_ADMIN_USERNAME:-admin}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-admin-demo-password}
      CREATE_DEMO_DATA: ${CREATE_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - application

  celery_worker:
    build:
      context: ./backend
    develop:
      watch:
        - action: rebuild
          path: ./backend
    command: celery -A config worker --loglevel=INFO
    environment:
      CERBERUS_ENV: development
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: change-me-for-local-development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerberus}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-cerberus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application

  janus:
    build:
      context: ./janus
    develop:
      watch:
        - action: rebuild
          path: ./janus
    environment:
      JANUS_ENV: development
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - application

  nginx:
    build:
      context: ./nginx
    develop:
      watch:
        - action: rebuild
          path: ./nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      janus:
        condition: service_healthy
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      - ./static/favicon.png:/usr/share/nginx/html/favicon.png:ro
    networks:
      - edge
      - application

volumes:
  postgres_data:
  static_data:

networks:
  edge:
  application:
    internal: true
